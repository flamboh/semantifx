# SemantiFX-owned compressor definition. See eq.toml for the field reference.
effect_type = "compressor"
description = "Dynamic range compressor with threshold, ratio, attack, soft knee, and makeup gain. Evens out level differences to add punch, tightness, sustain, glue, consistency, and perceived loudness, or to tame peaks and control dynamics."
order = 2

[[parameters]]
name = "threshold_db"
display_name = "Compressor Threshold"
unit = "dB"
min = -60.0
max = 0.0
default = -20.0
step = 0.1

[[parameters]]
name = "ratio"
display_name = "Compressor Ratio"
unit = "ratio"
min = 1.0
max = 20.0
default = 4.0
step = 0.01
scale = "log"

[[parameters]]
name = "attack_ms"
display_name = "Compressor Attack"
unit = "ms"
min = 5.0
max = 100.0
default = 20.0
step = 0.1
scale = "log"

[[parameters]]
name = "knee_db"
display_name = "Compressor Knee"
unit = "dB"
min = 1.0
max = 12.0
default = 6.0
step = 0.1

[[parameters]]
name = "makeup_gain_db"
display_name = "Compressor Makeup"
unit = "dB"
min = 0.0
max = 12.0
default = 0.0
step = 0.1
