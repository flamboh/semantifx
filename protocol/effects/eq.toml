# Six-band parametric EQ definition. scripts/gen turns this into the protocol
# schemas, the plugin parameter table, and the inference chain schema.
#
# Effect fields: effect_type, description (the Jev state description), and
# order (the catalogue order). Per-parameter fields: name (protocol
# identifier), display_name (host UI), unit, min/max/default (physical values),
# and optionally step (0 = continuous) and scale = "log" (host normalization
# skewed toward sqrt(min * max)).
effect_type = "eq"
description = "Six-band parametric equalizer with a low shelf, four peaking bands, and a high shelf. Boosts or cuts frequency ranges to shape brightness, warmth, body, presence, harshness, mud, thinness, and clarity."
order = 0

[[parameters]]
name = "low_shelf_gain_db"
display_name = "Low Shelf Gain"
unit = "dB"
min = -20.0
max = 20.0
default = 0.0
step = 0.1

[[parameters]]
name = "low_shelf_cutoff_freq"
display_name = "Low Shelf Frequency"
unit = "Hz"
min = 20.0
max = 2000.0
default = 200.0
scale = "log"

[[parameters]]
name = "low_shelf_q_factor"
display_name = "Low Shelf Q"
unit = "ratio"
min = 0.1
max = 6.0
default = 0.7071
scale = "log"

