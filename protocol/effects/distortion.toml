# SemantiFX-owned distortion definition. See eq.toml for the field reference.
effect_type = "distortion"
description = "Distortion with drive, character, tone, and wet/dry mix. Nonlinear waveshaping that adds harmonics for saturation, grit, warmth from soft clipping, overdrive, fuzz, and aggression."
order = 1

[[parameters]]
name = "drive_db"
display_name = "Distortion Drive"
unit = "dB"
min = 0.0
max = 48.0
default = 0.0
step = 0.1

[[parameters]]
name = "character"
display_name = "Distortion Character"
unit = "ratio"
min = 0.0
max = 1.0
default = 0.5
step = 0.001

[[parameters]]
name = "tone_db"
display_name = "Distortion Tone"
unit = "dB"
min = -12.0
max = 12.0
default = 0.0
step = 0.1

[[parameters]]
name = "mix"
display_name = "Distortion Mix"
unit = "ratio"
min = 0.0
max = 1.0
default = 0.25
step = 0.001
